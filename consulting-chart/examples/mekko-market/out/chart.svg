<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', 'PingFang SC', sans-serif"><style>text{font-variant-numeric:tabular-nums}</style><rect width="1280" height="720" fill="#FFFFFF"/><text x="48.0" y="62.0" font-size="28" fill="#0A0A0A" font-weight="bold" text-anchor="start" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', 'PingFang SC', sans-serif">部署形态份额:Cloud 规模最大,领导者占比 70%</text><text x="48.0" y="126.0" font-size="13" fill="#0A0A0A" font-weight="bold" text-anchor="start">部署形态 × 领导者份额(宽=规模,高=份额)</text><line x1="48.00" y1="136.00" x2="952.00" y2="136.00" stroke="#0A0A0A" stroke-width="1" stroke-linecap="butt"/><rect x="200.00" y="178.00" width="12.00" height="12.00" fill="#1B3FD8"/><text x="218.0" y="188.0" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="start">领导者</text><rect x="273.50" y="178.00" width="12.00" height="12.00" fill="#7FA6F2"/><text x="291.5" y="188.0" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="start">其他</text><rect x="200.00" y="317.00" width="313.00" height="203.00" fill="#1B3FD8"/><text x="356.5" y="422.5" font-size="11" fill="#FFFFFF" font-weight="bold" text-anchor="middle">70%</text><rect x="200.00" y="230.00" width="313.00" height="87.00" fill="#7FA6F2"/><text x="356.5" y="277.5" font-size="11" fill="#0A0A0A" font-weight="bold" text-anchor="middle">30%</text><text x="356.5" y="546.0" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="middle">Cloud(45%)</text><rect x="515.00" y="418.50" width="208.00" height="101.50" fill="#1B3FD8"/><text x="619.0" y="473.2" font-size="11" fill="#FFFFFF" font-weight="bold" text-anchor="middle">35%</text><rect x="515.00" y="230.00" width="208.00" height="188.50" fill="#7FA6F2"/><text x="619.0" y="328.2" font-size="11" fill="#0A0A0A" font-weight="bold" text-anchor="middle">65%</text><text x="619.0" y="546.0" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="middle">On-prem(30%)</text><rect x="725.00" y="360.50" width="173.00" height="159.50" fill="#1B3FD8"/><text x="811.5" y="444.2" font-size="11" fill="#FFFFFF" font-weight="bold" text-anchor="middle">55%</text><rect x="725.00" y="230.00" width="173.00" height="130.50" fill="#7FA6F2"/><text x="811.5" y="299.2" font-size="11" fill="#0A0A0A" font-weight="bold" text-anchor="middle">45%</text><text x="811.5" y="546.0" font-size="10.5" fill="#333333" font-weight="normal" text-anchor="middle">Edge(25%)</text><line x1="200.00" y1="520.00" x2="900.00" y2="520.00" stroke="#111111" stroke-width="1.6" stroke-linecap="butt"/><text x="1000.0" y="126.0" font-size="13" fill="#0A0A0A" font-weight="bold" text-anchor="start">关键洞察</text><text x="1000.0" y="160.0" font-size="10.5" fill="#0A0A0A" font-weight="bold" text-anchor="start">Cloud</text><text x="1000.0" y="177.0" font-size="10.0" fill="#333333" font-weight="normal" text-anchor="start">规模 45%,领导者 70%,规模与份额双高。</text><text x="1000.0" y="206.0" font-size="10.5" fill="#0A0A0A" font-weight="bold" text-anchor="start">On-prem</text><text x="1000.0" y="223.0" font-size="10.0" fill="#333333" font-weight="normal" text-anchor="start">规模 30%,领导者仅 35%,改造空间最大。</text><text x="1000.0" y="252.0" font-size="10.5" fill="#0A0A0A" font-weight="bold" text-anchor="start">Edge</text><text x="1000.0" y="269.0" font-size="10.0" fill="#333333" font-weight="normal" text-anchor="start">规模 25%,领导者 55%,居中。</text><text x="48.0" y="702.0" font-size="8.5" fill="#8F8F8F" font-weight="normal" text-anchor="start">示例数据(马赛克图用例)</text></svg>