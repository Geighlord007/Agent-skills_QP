<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', 'PingFang SC', sans-serif"><style>text{font-variant-numeric:tabular-nums}</style><rect width="1280" height="720" fill="#FFFFFF"/><text x="48.0" y="62.0" font-size="28" fill="#0A0A0A" font-weight="bold" text-anchor="start" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', 'PingFang SC', sans-serif">转化漏斗:1,000 访客最终成交 30,总转化 3.0%</text><text x="48.0" y="126.0" font-size="13" fill="#0A0A0A" font-weight="bold" text-anchor="start">转化漏斗(人数)</text><line x1="48.00" y1="136.00" x2="952.00" y2="136.00" stroke="#0A0A0A" stroke-width="1" stroke-linecap="butt"/><text x="280.0" y="190.0" font-size="9" fill="#6B6B6B" font-weight="normal" text-anchor="end">阶段</text><text x="848.0" y="190.0" font-size="9" fill="#6B6B6B" font-weight="normal" text-anchor="start">人数</text><text x="920.0" y="190.0" font-size="9" fill="#6B6B6B" font-weight="normal" text-anchor="start">较上一阶段</text><rect x="300.00" y="207.00" width="520.00" height="46.00" fill="#0B2E6F"/><text x="280.0" y="234.0" font-size="11" fill="#333333" font-weight="normal" text-anchor="end">Visitors</text><text x="848.0" y="234.0" font-size="11" fill="#0A0A0A" font-weight="bold" text-anchor="start">1,000</text><rect x="476.80" y="291.00" width="166.40" height="46.00" fill="#1B4FA8"/><text x="280.0" y="318.0" font-size="11" fill="#333333" font-weight="normal" text-anchor="end">Leads</text><text x="848.0" y="318.0" font-size="11" fill="#0A0A0A" font-weight="bold" text-anchor="start">320</text><text x="920.0" y="318.0" font-size="10" fill="#6B6B6B" font-weight="normal" text-anchor="start">32.0%</text><rect x="528.80" y="375.00" width="62.40" height="46.00" fill="#3D79DB"/><text x="280.0" y="402.0" font-size="11" fill="#333333" font-weight="normal" text-anchor="end">Qualified</text><text x="848.0" y="402.0" font-size="11" fill="#0A0A0A" font-weight="bold" text-anchor="start">120</text><text x="920.0" y="402.0" font-size="10" fill="#6B6B6B" font-weight="normal" text-anchor="start">37.5%</text><rect x="552.20" y="459.00" width="15.60" height="46.00" fill="#7FAEF2"/><text x="280.0" y="486.0" font-size="11" fill="#333333" font-weight="normal" text-anchor="end">Closed</text><text x="848.0" y="486.0" font-size="11" fill="#0A0A0A" font-weight="bold" text-anchor="start">30</text><text x="920.0" y="486.0" font-size="10" fill="#6B6B6B" font-weight="normal" text-anchor="start">25.0%</text><text x="48.0" y="620.0" font-size="9.5" fill="#6B6B6B" font-weight="normal" text-anchor="start">总转化 3.0%(1,000 → 30);最大单步流失:Visitors → Leads(-680)。</text><text x="1000.0" y="126.0" font-size="13" fill="#0A0A0A" font-weight="bold" text-anchor="start">关键洞察</text><text x="1000.0" y="160.0" font-size="10.5" fill="#0A0A0A" font-weight="bold" text-anchor="start">总转化 3.0%</text><text x="1000.0" y="177.0" font-size="10.0" fill="#333333" font-weight="normal" text-anchor="start">1,000 访客到 30 成交,整体转化 3.0%。</text><text x="1000.0" y="206.0" font-size="10.5" fill="#0A0A0A" font-weight="bold" text-anchor="start">首步流失最大</text><text x="1000.0" y="223.0" font-size="10.0" fill="#333333" font-weight="normal" text-anchor="start">访客到线索 1,000 → 320,流失 680;单步转化 32.0%。</text><text x="1000.0" y="252.0" font-size="10.5" fill="#0A0A0A" font-weight="bold" text-anchor="start">末步转化最低</text><text x="1000.0" y="269.0" font-size="10.0" fill="#333333" font-weight="normal" text-anchor="start">合格到成交 120 → 30,单步转化 25.0%。</text><text x="48.0" y="702.0" font-size="8.5" fill="#8F8F8F" font-weight="normal" text-anchor="start">示例数据(转化漏斗用例)</text></svg>