<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', 'PingFang SC', sans-serif"><style>text{font-variant-numeric:tabular-nums}</style><rect width="1280" height="720" fill="#FFFFFF"/><text x="48.0" y="62.0" font-size="28" fill="#0A0A0A" font-weight="bold" text-anchor="start" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', 'PingFang SC', sans-serif">三情景对比:Scenario 3 规模与 EBITDA 最高,毛利率保持稳定</text><text x="48.0" y="126.0" font-size="13" fill="#0A0A0A" font-weight="bold" text-anchor="start">情景对比(US$ M)</text><line x1="48.00" y1="136.00" x2="952.00" y2="136.00" stroke="#0A0A0A" stroke-width="1" stroke-linecap="butt"/><rect x="120.00" y="160.00" width="12.00" height="12.00" fill="#1B3FD8"/><text x="138.0" y="170.0" font-size="10" fill="#333333" font-weight="normal" text-anchor="start">Scenario 1</text><rect x="212.20" y="160.00" width="12.00" height="12.00" fill="#2972FF"/><text x="230.2" y="170.0" font-size="10" fill="#333333" font-weight="normal" text-anchor="start">Scenario 2</text><rect x="304.40" y="160.00" width="12.00" height="12.00" fill="#7FA6F2"/><text x="322.4" y="170.0" font-size="10" fill="#333333" font-weight="normal" text-anchor="start">Scenario 3</text><line x1="100.00" y1="540.00" x2="958.00" y2="540.00" stroke="#111111" stroke-width="1.6" stroke-linecap="butt"/><rect x="137.60" y="283.30" width="32.00" height="256.70" fill="#1B3FD8"/><text x="153.6" y="275.3" font-size="10" fill="#0A0A0A" font-weight="bold" text-anchor="middle">115</text><rect x="187.20" y="260.98" width="32.00" height="279.02" fill="#2972FF"/><text x="203.2" y="253.0" font-size="10" fill="#0A0A0A" font-weight="bold" text-anchor="middle">125</text><rect x="236.80" y="245.36" width="32.00" height="294.64" fill="#7FA6F2"/><text x="252.8" y="237.4" font-size="10" fill="#0A0A0A" font-weight="bold" text-anchor="middle">132</text><text x="203.2" y="566.0" font-size="10" fill="#333333" font-weight="normal" text-anchor="middle">Revenue</text><rect x="304.00" y="415.00" width="32.00" height="125.00" fill="#1B3FD8"/><text x="320.0" y="407.0" font-size="10" fill="#0A0A0A" font-weight="bold" text-anchor="middle">56</text><rect x="353.60" y="406.07" width="32.00" height="133.93" fill="#2972FF"/><text x="369.6" y="398.1" font-size="10" fill="#0A0A0A" font-weight="bold" text-anchor="middle">60</text><rect x="403.20" y="397.14" width="32.00" height="142.86" fill="#7FA6F2"/><text x="419.2" y="389.1" font-size="10" fill="#0A0A0A" font-weight="bold" text-anchor="middle">64</text><text x="369.6" y="566.0" font-size="10" fill="#333333" font-weight="normal" text-anchor="middle">COGS</text><rect x="470.40" y="408.30" width="32.00" height="131.70" fill="#1B3FD8"/><text x="486.4" y="400.3" font-size="10" fill="#0A0A0A" font-weight="bold" text-anchor="middle">59</text><rect x="520.00" y="394.91" width="32.00" height="145.09" fill="#2972FF"/><text x="536.0" y="386.9" font-size="10" fill="#0A0A0A" font-weight="bold" text-anchor="middle">65</text><rect x="569.60" y="388.21" width="32.00" height="151.79" fill="#7FA6F2"/><text x="585.6" y="380.2" font-size="10" fill="#0A0A0A" font-weight="bold" text-anchor="middle">68</text><text x="536.0" y="566.0" font-size="10" fill="#333333" font-weight="normal" text-anchor="middle">Gross Profit</text><rect x="636.80" y="457.41" width="32.00" height="82.59" fill="#1B3FD8"/><text x="652.8" y="449.4" font-size="10" fill="#0A0A0A" font-weight="bold" text-anchor="middle">37</text><rect x="686.40" y="444.02" width="32.00" height="95.98" fill="#2972FF"/><text x="702.4" y="436.0" font-size="10" fill="#0A0A0A" font-weight="bold" text-anchor="middle">43</text><rect x="736.00" y="448.48" width="32.00" height="91.52" fill="#7FA6F2"/><text x="752.0" y="440.5" font-size="10" fill="#0A0A0A" font-weight="bold" text-anchor="middle">41</text><text x="702.4" y="566.0" font-size="10" fill="#333333" font-weight="normal" text-anchor="middle">OPEX</text><rect x="803.20" y="490.89" width="32.00" height="49.11" fill="#1B3FD8"/><text x="819.2" y="482.9" font-size="10" fill="#0A0A0A" font-weight="bold" text-anchor="middle">22</text><rect x="852.80" y="490.89" width="32.00" height="49.11" fill="#2972FF"/><text x="868.8" y="482.9" font-size="10" fill="#0A0A0A" font-weight="bold" text-anchor="middle">22</text><rect x="902.40" y="479.73" width="32.00" height="60.27" fill="#7FA6F2"/><text x="918.4" y="471.7" font-size="10" fill="#0A0A0A" font-weight="bold" text-anchor="middle">27</text><text x="868.8" y="566.0" font-size="10" fill="#333333" font-weight="normal" text-anchor="middle">EBITDA</text><text x="1000.0" y="126.0" font-size="13" fill="#0A0A0A" font-weight="bold" text-anchor="start">关键洞察</text><text x="1000.0" y="160.0" font-size="10.5" fill="#0A0A0A" font-weight="bold" text-anchor="start">Scenario 3 双高</text><text x="1000.0" y="177.0" font-size="10.0" fill="#333333" font-weight="normal" text-anchor="start">收入 132、EBITDA 27,均为三情景最高。</text><text x="1000.0" y="206.0" font-size="10.5" fill="#0A0A0A" font-weight="bold" text-anchor="start">毛利率稳定</text><text x="1000.0" y="223.0" font-size="10.0" fill="#333333" font-weight="normal" text-anchor="start">51%、52%、52%,收入增长未牺牲毛利率。</text><text x="1000.0" y="252.0" font-size="10.5" fill="#0A0A0A" font-weight="bold" text-anchor="start">OPEX 抵消</text><text x="1000.0" y="269.0" font-size="10.0" fill="#333333" font-weight="normal" text-anchor="start">Scenario 2 的 OPEX 43 为最高,毛利增量 6 被完全</text><text x="1000.0" y="284.0" font-size="10.0" fill="#333333" font-weight="normal" text-anchor="start">抵消,EBITDA 与 Scenario 1 持平 22。</text><text x="48.0" y="600.0" font-size="8.5" fill="#8F8F8F" font-weight="normal" text-anchor="start">单位 US$ M;Gross Profit = Revenue − COGS;EBITDA = Gross Profit − OPEX。</text><text x="48.0" y="702.0" font-size="8.5" fill="#8F8F8F" font-weight="normal" text-anchor="start">示例数据(情景对比用例)</text></svg>